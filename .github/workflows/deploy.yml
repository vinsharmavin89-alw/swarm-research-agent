name: SwarmIQ CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Agent Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate agent imports
        run: |
          python -c "from agents.planner import run_planner; print('Planner OK')"
          python -c "from agents.retriever import run_retriever; print('Retriever OK')"
          python -c "from agents.validator import run_validator; print('Validator OK')"
          python -c "from agents.writer import run_writer; print('Writer OK')"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Validate FastAPI app
        run: |
          python -c "from main import app; print('FastAPI app OK')"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Check Docker configuration
        run: |
          docker build -t swarmiq-test .
          echo "Docker build successful"

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy notification
        run: |
          echo "SwarmIQ deployment triggered"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref }}"
          echo "All agents validated successfully"
          echo "Live at: https://swarmiq-e4zw.onrender.com/dashboard"